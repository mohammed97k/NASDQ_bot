
name: Add Symbol to TickerAll

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Add NDXUSD
        env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
        run: |
          pip install requests
          cat > add.py << 'PYEOF'
          import os, requests, json
          KEY = os.environ['TICKERALL_API_KEY']
          SRV = os.environ['MT5_SERVER']
          ACC = os.environ['MT5_ACCOUNT']
          PWD = os.environ['MT5_PASSWORD']
          BASE = 'https://api.tickerall.com'
          H = {'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json'}
          r = requests.post(BASE + '/v1/sessions', headers=H, json={'broker':'mt5','server':SRV,'account':int(ACC) if ACC.isdigit() else ACC,'password':PWD}, timeout=30)
          aid = r.json().get('accountId')
          print('AccountId:', aid)

          # Try different endpoints to add symbol
          endpoints = [
              ('POST', '/v1/accounts/' + aid + '/symbols', {'symbol': 'NDXUSD'}),
              ('POST', '/v1/accounts/' + aid + '/watch',   {'symbol': 'NDXUSD'}),
              ('POST', '/v1/accounts/' + aid + '/symbols/watch', {'symbol': 'NDXUSD'}),
              ('PUT',  '/v1/accounts/' + aid + '/symbols/NDXUSD', {}),
          ]
          for method, path, body in endpoints:
              url = BASE + path
              try:
                  if method == 'POST':
                      rr = requests.post(url, headers=H, json=body, timeout=30)
                  else:
                      rr = requests.put(url, headers=H, json=body, timeout=30)
                  print(method, path, '->', rr.status_code, rr.text[:200])
              except Exception as e:
                  print(method, path, 'ERR:', e)

          # Recheck symbols
          r2 = requests.get(BASE + '/v1/accounts/' + aid + '/symbols', headers=H, timeout=60)
          print('After:', r2.text[:500])
          PYEOF
          python3 add.py