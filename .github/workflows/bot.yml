name: NAS100 Signals Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: nas100-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas numpy requests pytz

      - name: Loop every 5 min for 55 min
        env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
        run: |
          END=$((SECONDS + 3300))
          i=0
          while [ $SECONDS -lt $END ]; do
            i=$((i+1))
            echo "═══ Cycle $i — $(date -u) ═══"
            python -u ict_bot.py || echo "Bot error, continuing..."
            if [ -f state.json ]; then
              git add state.json || true
              git diff --staged --quiet || (git -c user.name="bot" -c user.email="bot@local" commit -m "s [skip ci]" && git push) || true
            fi
            sleep 300
          done